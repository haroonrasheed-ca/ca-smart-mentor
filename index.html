<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>CA Smart Mentor</title>
  <meta name="description" content="A calm study mentor for articleship days.">
  <meta name="theme-color" content="#0c1a22">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/icon-192.png" type="image/png">
  <link rel="apple-touch-icon" href="icons/icon-192.png">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>
  <div class="app">
    <header id="top" class="topbar"></header>
    <main id="view" aria-live="polite"></main>
  </div>

  <nav id="nav" class="nav" aria-label="Main">
    <button data-act="tab" data-v="today" aria-label="Today">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 11.5 12 4l9 7.5V20a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1z"/></svg><span>Today</span>
    </button>
    <button data-act="tab" data-v="pace" aria-label="Pace">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 20h18M5 16l4-5 4 3 6-8"/></svg><span>Pace</span>
    </button>
    <button data-act="tab" data-v="topics" aria-label="Topics">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 4h11a3 3 0 0 1 3 3v13H8a3 3 0 0 1-3-3zM5 17a3 3 0 0 1 3-3h11"/></svg><span>Topics</span>
    </button>
    <button data-act="tab" data-v="settings" aria-label="Settings">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 7h10M18 7h2M4 17h2M10 17h10"/><circle cx="16" cy="7" r="2"/><circle cx="8" cy="17" r="2"/></svg><span>Settings</span>
    </button>
  </nav>

  <div id="session" class="session" hidden></div>
  <div id="sheet" class="sheet-root" hidden></div>
  <div id="toast" class="toast" role="status" aria-live="polite"></div>

  <noscript>This app needs JavaScript.</noscript>
  <script type="module" src="js/app.js"></script>
</body>
</html>
